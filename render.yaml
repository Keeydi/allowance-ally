# Render Blueprint: deploy backend for FREE (no credit card)
# https://render.com/docs/blueprint-spec
# 1. Push to GitHub
# 2. New > Blueprint > connect repo
# 3. Add DB_*, JWT_SECRET, SUPABASE_JWT_SECRET in Environment

services:
  - type: web
    name: allowance-ally-api
    runtime: node
    plan: free
    rootDir: backend
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
